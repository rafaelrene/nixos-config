tree-root-file = "devenv.nix"
excludes = [".devenv/**"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w"]
includes = ["*.sh"]

[formatter.lua]
command = "stylua"
options = ["--search-parent-directories"]
includes = ["*.lua"]

[formatter.python]
command = "ruff"
options = ["format"]
includes = ["*.py"]
